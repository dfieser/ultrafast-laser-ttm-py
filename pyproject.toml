[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laserttm"
version = "0.1.0.dev0"
description = "Two-temperature model solvers for ultrafast pulsed-laser heating of metals (Python port of the Ultrafast Laser TTM Toolbox)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "David Fieser", email = "dfieser9@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "two-temperature-model",
    "ultrafast-laser",
    "femtosecond",
    "laser-heating",
    "heat-accumulation",
    "tungsten",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff"]

[project.urls]
Homepage = "https://github.com/dfieser/ultrafast-laser-ttm-py"
"Reference implementation (MATLAB)" = "https://github.com/dfieser/ultrafast-laser-ttm-toolbox"
Paper = "https://doi.org/10.1007/s11665-026-14738-6"

[tool.hatch.build.targets.wheel]
packages = ["src/laserttm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running validation cases (deselected by default; run with `pytest -m slow`)",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
src = ["src"]
